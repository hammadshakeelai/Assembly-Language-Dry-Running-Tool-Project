<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Assembly Dry Run Sheet</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="toolbar">
        <button onclick="app.addRow()">+ Add Row</button>
        <button onclick="app.insertVariableTemplate()" class="action-btn">+ Add Variable/Array</button>
        <button onclick="app.syncRAM()">Sync RAM Layout</button>
        <button onclick="app.clearAll()" class="danger">Clear Sheet</button>
        
        <div class="color-picker" id="color-picker">
            <span style="font-size: 14px; font-weight: bold; margin-right: 5px;">Highlighter:</span>
        </div>
    </div>

    <div class="grid-container">
        <table id="output-grid">
            <thead id="grid-head"></thead>
            <tbody id="grid-body"></tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
