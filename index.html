<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assembly Dry Run Setup Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            display: flex;
            gap: 20px;
            background-color: #f9f9f9;
        }
        .editor-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 300px;
        }
        .toolbar {
            margin-bottom: 10px;
        }
        button {
            padding: 10px 15px;
            background-color: #006699;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #004d73;
        }
        textarea {
            width: 100%;
            height: 500px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: none;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
        }
        .grid-pane {
            flex: 2;
            overflow-x: auto;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        table {
            border-collapse: collapse;
            width: max-content;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
        }
        th, td {
            border: 1px solid #d4d4d4;
            padding: 8px 12px;
            text-align: center;
            min-width: 60px;
            height: 24px;
        }
        th {
            background-color: #f0f0f0;
            font-weight: normal;
            color: #333;
        }
        td.code-cell {
            text-align: left;
            color: #006699; 
            font-weight: bold;
            white-space: nowrap;
            background-color: #fafafa;
            user-select: none;
        }
        /* Excel-like interaction styling */
        td[contenteditable="true"] {
            outline: none;
            cursor: text;
        }
        td[contenteditable="true"]:focus {
            outline: 2px solid #217346; /* Excel green outline */
            background-color: #f4fff8;
        }
        .highlight {
            background-color: #ffff00 !important;
        }
        .sub-header {
            background-color: #fafafa;
            color: #666;
            font-size: 14px;
        }
        .instructions {
            font-size: 14px;
            color: #555;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="editor-pane">
        <div class="toolbar">
            <button onclick="generateSetup()">Generate Sheet</button>
        </div>
        <textarea id="asm-code" spellcheck="false">
[org 0x0100]

tag db 00 01, 01 04, 08 00

mov ax, 2
mov bx, 2
add ax, bx

mov ax, 0x4c00
int 0x21</textarea>
    </div>

    <div class="grid-pane">
        <div class="instructions">
            <strong>How to use:</strong> Click any cell to type. <strong>Double-click</strong> a cell to highlight it yellow.
        </div>
        <table id="output-grid">
            <thead id="grid-head">
                </thead>
            <tbody id="grid-body">
                </tbody>
        </table>
    </div>

    <script>
        function generateSetup() {
            const code = document.getElementById('asm-code').value;
            const lines = code.split('\n');
            const thead = document.getElementById('grid-head');
            const tbody = document.getElementById('grid-body');
            
            thead.innerHTML = '';
            tbody.innerHTML = '';

            let variables = [];

            // --- Find variables to build dynamic columns ---
            lines.forEach(line => {
                let cleanLine = line.split(';')[0].trim();
                let varMatch = cleanLine.match(/^([a-zA-Z_]\w*)\s+(d[bwd])\s+(.+)$/i);
                
                if (varMatch) {
                    let name = varMatch[1];
                    let type = varMatch[2].toLowerCase();
                    let vals = varMatch[3].split(/,\s*|\s{2,}/).map(v => v.trim());
                    variables.push({ name, type, vals });
                }
            });

            // --- BUILD HEADERS ---
            let trHead1 = document.createElement('tr');
            let trHead2 = document.createElement('tr'); 
            trHead2.className = 'sub-header';

            // Fixed columns
            ['Instruction', 'ax', 'bx', 'cx', 'dx'].forEach(text => {
                let th = document.createElement('th');
                th.textContent = text;
                th.rowSpan = 2; 
                trHead1.appendChild(th);
            });

            // Dynamic memory columns
            variables.forEach(v => {
                let thVarName = document.createElement('th');
                thVarName.textContent = `${v.name} ${v.type}`;
                thVarName.rowSpan = 2;
                trHead1.appendChild(thVarName);

                v.vals.forEach((val, index) => {
                    let thVal = document.createElement('th');
                    thVal.textContent = val;
                    trHead1.appendChild(thVal);

                    let thIdx = document.createElement('th');
                    thIdx.textContent = index; 
                    trHead2.appendChild(thIdx);
                });
            });

            thead.appendChild(trHead1);
            thead.appendChild(trHead2);

            // Calculate total columns for formatting purposes
            const totalDynamicCols = variables.reduce((acc, v) => acc + 1 + v.vals.length, 0);
            
            // --- BUILD EMPTY ROWS FOR INSTRUCTIONS ---
            lines.forEach(line => {
                let cleanLine = line.split(';')[0].trim();
                let tr = document.createElement('tr');
                
                let tdCode = document.createElement('td');
                tdCode.className = 'code-cell';
                tdCode.textContent = line;
                
                // If it's empty or a directive, just span the whole row
                if (!cleanLine || cleanLine.startsWith('[') || cleanLine.includes(' db ') || cleanLine.includes(' dw ')) {
                    if (line.trim() !== '') {
                        tdCode.colSpan = 5 + totalDynamicCols; 
                        tr.appendChild(tdCode);
                        tbody.appendChild(tr);
                    }
                    return; 
                }

                // If it's actual code, create the editable cells
                tr.appendChild(tdCode);

                // 4 registers + all dynamic columns
                const emptyCellsNeeded = 4 + totalDynamicCols;
                for(let i = 0; i < emptyCellsNeeded; i++) {
                    let td = document.createElement('td');
                    td.contentEditable = "true"; // Makes it behave like Excel
                    tr.appendChild(td);
                }

                tbody.appendChild(tr);
            });
        }

        // Toggle yellow highlight on double click
        document.getElementById('grid-body').addEventListener('dblclick', function(e) {
            if(e.target.tagName === 'TD' && e.target.hasAttribute('contenteditable')) {
                e.target.classList.toggle('highlight');
                // Clear text selection that happens on double click
                window.getSelection().removeAllRanges(); 
            }
        });

        // Generate the initial sheet on load
        generateSetup();
    </script>
</body>
</html>
